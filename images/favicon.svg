<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="64" height="64" fill="#2c3e50"/>
  
  <!-- Stacked blocks design (like logo) -->
  <!-- Bottom block -->
  <rect x="12" y="40" width="16" height="16" fill="#3498db"/>
  
  <!-- Middle block -->
  <rect x="22" y="24" width="16" height="16" fill="#3498db"/>
  
  <!-- Top block -->
  <rect x="32" y="8" width="16" height="16" fill="#3498db"/>
  
  <!-- Add B&A text -->
  <text x="8" y="56" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">B&amp;A</text>
</svg>
