<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <title>404 - Página No Encontrada | Basaltos & Agregados</title>
  <meta name="description" content="La página que busca no existe. Regrese al inicio de Basaltos & Agregados.">
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Favicon -->
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  
  <!-- Modern Stylesheet -->
  <link rel="stylesheet" href="/css/modern-style.css">
  
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      background: linear-gradient(135deg, rgba(44, 62, 80, 0.05), rgba(52, 152, 219, 0.05));
    }
    
    .error-content {
      max-width: 600px;
    }
    
    .error-code {
      font-size: 8rem;
      font-weight: 800;
      color: var(--secondary-color);
      line-height: 1;
      margin-bottom: 1rem;
    }
    
    .error-message {
      font-size: 1.5rem;
      color: var(--text-color);
      margin-bottom: 1rem;
    }
    
    .error-description {
      color: var(--text-light);
      margin-bottom: 2rem;
    }
    
    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    @media (max-width: 768px) {
      .error-code {
        font-size: 5rem;
      }
      
      .error-message {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <!-- Header Navigation -->
  <header class="modern-header">
    <nav class="nav-container" style="display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem;">
      <a href="/" class="logo">
        <img src="/images/main-logo.png" alt="Basaltos & Agregados" style="height: 50px;">
      </a>
      
      <ul class="nav-menu">
        <li><a href="/">Inicio</a></li>
        <li><a href="/about">Nosotros</a></li>
        <li><a href="/contact">Contacto</a></li>
        <li>
          🌐 <select class="language-selector" onchange="location = this.value;" aria-label="Seleccionar Idioma">
            <option value="/" selected>ES</option>
            <option value="/en/">EN</option>
            <option value="/cn/">CN</option>
          </select>
        </li>
      </ul>
      
      <button class="mobile-toggle" aria-label="Toggle navigation" aria-expanded="false">
        ☰
      </button>
    </nav>
  </header>

  <!-- Error Content -->
  <div class="error-container">
    <div class="error-content">
      <div class="error-code">404</div>
      <h1 class="error-message">Página No Encontrada</h1>
      <p class="error-description">
        Lo sentimos, la página que está buscando no existe o ha sido movida.
      </p>
      <div class="error-actions">
        <a href="/" class="btn btn-primary">Volver al Inicio</a>
        <a href="/contact" class="btn btn-outline" style="color: var(--text-color); border-color: var(--secondary-color);">Contacto</a>
      </div>
    </div>
  </div>

  <!-- Configuration -->
  <script src="/js/config.js"></script>
  <!-- Modern JavaScript -->
  <script src="/js/modern-script.js"></script>
</body>
</html>
